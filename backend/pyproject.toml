# Tool configuration only — no [build-system]/[project] table on purpose.
# The app is not installed as a package; it runs via `uvicorn app.main:app`
# from backend/, and pytest resolves `app` through its own rootdir-insertion
# (backend/ has no __init__.py, so pytest adds it to sys.path). Adding a
# build-system here would invite `pip install -e .` drift from that assumption.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = [
    # Exercised by the offline evaluation harness against real media rather
    # than by unit tests; counting them would give a misleading picture in
    # either direction.
    "app/services/detection/image_detector.py",
    "app/services/detection/landmark_analysis.py",
]

[tool.coverage.report]
show_missing = true
# Ratchet: raise this as coverage improves, never lower it to make a build
# pass. Set just under the measured baseline (91.3% at the time of writing)
# so ordinary changes don't trip it, but a real regression does.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "ANN001", "BLE"]
ignore = [
    "ANN101", # missing type annotation for self — noise
    "ANN102", # missing type annotation for cls — noise
]

[tool.ruff.lint.per-file-ignores]
# Tests read better with slightly longer lines (assertion messages, inline
# fixture data) and do not need annotated fixture parameters.
"tests/*" = ["ANN001", "E501"]

# B008 flags function calls in argument defaults. In FastAPI, `Depends(...)`,
# `File(...)` and `Header(...)` in defaults are THE documented idiom for
# declaring dependencies -- the framework resolves them per-request rather
# than reusing one evaluated default. Flagging them here is a false positive,
# scoped to the layer where the idiom legitimately appears.
"app/api/v1/*.py" = ["B008"]
"app/core/security.py" = ["B008"]

# reasoning.py is a table of user-facing explanation templates. These are
# single-sentence strings shown verbatim in the UI; wrapping them across
# lines would obscure the text being reviewed for tone and accuracy, which
# is the main reason anyone reads this file.
"app/services/explainability/reasoning.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
# Intentionally not --strict yet: the codebase predates this config and
# hasn't been typed against it. Tighten incrementally (see R12) rather than
# drowning the first run in unrelated findings.
